<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1>Calculadora de Abastecimento</h1>
    <br>

    <p>Tabela de Preços</p>
    <ul>
        <li>Gasolina: 6,69</li>
        <li>Etanol: 4,30</li>
        <li>Disel: 6,03</li>
    </ul>

    <form action="" id="formularioAbastecimento">
        <label for="combustivel">Tipo Combustivel</label>
        <select name="combustivel" id="combustivel">
            <option value="">Escolha uma Opcao</option>
            <option value="gasolina">Gasolina</option>
            <option value="etanol">Etanol</option>
            <option value="diesel">Diesel</option>
        </select>

        <label for="litros">Quantidade (litros)</label>
        <input type="number" min="0" step="0.1">
    </form>

    <h2>Resultado</h2>
    <p id="resultado"></p>

    <script src="script.js"></script>
</body>
</html>
