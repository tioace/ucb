<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Contador de Cliques</h1>
    <button id="incrementa">Incrementa</button>
    <button id="decrementa">Decrementa</button>
    <P id="quantidade"></P>
    
    <br>
    
    <h1>Texto dinâmico</h1>
    <input type="text" name="texto" id="texto" placeholder="Digite um texto aqui!">
    <p id="textoEscrito"></p>
    <p>Contador de caracteres: </p>
    <p id="contador"></p>
    <p>Adicionar novo item: </p>

    <select name="tipo" id="tipo">
        <option value="">Escolha uma opcao: </option>
        <option value="ordenada">Lista ordenada</option>
        <option value="naoOrdenada">Lista nao ordenada</option>
    </select>
    
    <button id="adicionar">Adicionar Item</button>
    <h2>Resultado:</h2>
    <p id="resultado"></p>

    <div id="containerListas"></div> <br>

    <button id="reset">Reset</button>

    <br>

    <script src="script.js"></script>
</body>
</html>
